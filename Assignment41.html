
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoints Multi Screen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #555;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            margin-bottom: 10px;
        }

        /* Tablet Screen */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }

            nav a {
                margin: 8px;
            }

            header {
                background-color: #2874a6;
            }
        }

        /* Mobile Screen */
        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            nav a {
                display: block;
                margin: 10px;
            }

            header {
                background-color: #218c74;
                font-size: 14px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Web Design</h1>
        <p>Multi Screen Breakpoints Example</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="card">
            <h2>Mobile</h2>
            <p>Designed for small screens.</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p>Designed for medium screens.</p>
        </div>

        <div class="card">
            <h2>Desktop</h2>
            <p>Designed for large screens.</p>
        </div>

    </div>

</body>
</html>
